name: Build Real FaceSwap APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
      - name: 下载 Android 平台与构建工具
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 生成安卓平台工程（在临时目录生成 android/ 再拷回）
        run: |
          mkdir -p /tmp/faceswap_build
          cp pubspec.yaml analysis_options.yaml /tmp/faceswap_build/
          cp -r lib /tmp/faceswap_build/
          cd /tmp/faceswap_build
          flutter create --platforms=android .
          cp -r android "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          ls -la android

      - name: 覆盖原生换脸模块与配置
        run: cp -r android_overlay/app/* android/app/

      - name: 下载真实换脸模型（检测 / 识别 / 换脸）
        run: |
          set -e
          MODEL_DIR=android/app/src/main/assets/models
          mkdir -p "$MODEL_DIR"

          echo "==> 下载 YuNet 检测器"
          curl -fL --retry 3 --max-time 60 -o "$MODEL_DIR/yunet.onnx" \
            https://github.com/opencv/opencv_zoo/raw/refs/heads/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          [ $(stat -c%s "$MODEL_DIR/yunet.onnx") -gt 10000 ] || { echo "ERROR: yunet.onnx 下载失败或太小"; exit 1; }

          echo "==> 下载 inswapper_128 (fp32，手机 CPU 可跑)"
          curl -fL --retry 3 --max-time 300 -o "$MODEL_DIR/inswapper_128.onnx" \
            https://huggingface.co/datasets/Gourieff/ReActor/resolve/main/models/inswapper_128.onnx
          [ $(stat -c%s "$MODEL_DIR/inswapper_128.onnx") -gt 1000000 ] || { echo "ERROR: inswapper_128.onnx 下载失败或太小"; exit 1; }

          echo "==> 下载 ArcFace (buffalo_l)"
          curl -fL --retry 3 --max-time 300 -o /tmp/buffalo_l.zip \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          [ $(stat -c%s /tmp/buffalo_l.zip) -gt 1000000 ] || { echo "ERROR: buffalo_l.zip 下载失败或太小"; exit 1; }
          unzip -o /tmp/buffalo_l.zip -d /tmp/buffalo
          find /tmp/buffalo -name "w600k_r50.onnx" -print
          cp "$(find /tmp/buffalo -name 'w600k_r50.onnx' | head -n1)" "$MODEL_DIR/"

          echo "==> 模型清单"
          ls -lh "$MODEL_DIR/"

      - name: 调整 Gradle 内存（模型较大，避免 OOM）
        run: echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: 编译真实换脸 APK（release）
        run: |
          flutter pub get
          flutter build apk --release --dart-define=USE_REAL_ENGINE=true

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: faceswap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
