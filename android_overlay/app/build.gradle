plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.example.faceswap"
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: 改成你自己的应用 ID
        applicationId "com.example.faceswap"
        // ONNX Runtime Mobile 需要 minSdk 21；这里用 24 兼顾性能
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // 仅保留 64 位架构，安装包显著变小（旧 32 位手机无法安装，2019 年后机型均支持）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // 调试签名即可本地安装；正式发布请配置自己的签名
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // ONNX 模型以 .onnx 存放于 assets，禁止压缩以便原生直接读取
    aaptOptions {
        noCompress "onnx"
    }
}

dependencies {
    // 端侧换脸推理框架（ONNX Runtime Android，与 Roop/ReActor 同款模型链路）
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"
    // 原生耗时推理必须在后台协程执行，避免阻塞 Flutter UI
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}

flutter {
    source '../..'
}
